name: Test Extension

"on":
  pull_request:
    paths:
      - 'linkjoin-extension/**'
  push:
    branches: [main, dev]
    paths:
      - 'linkjoin-extension/**'
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkjoin-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
