name: Test Backend

"on":
  pull_request:
    paths:
      - 'linkjoin-backend/**'
  push:
    branches: [main, dev]
    paths:
      - 'linkjoin-backend/**'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkjoin-backend
    services:
      # Production points the rate limiter at Azure Cache for Redis. Without a
      # Redis here, CI would exercise the in-memory fallback instead of the code
      # path that actually ships.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DATABASE: linkjoin_test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
      GMAIL_PWD: ${{ secrets.GMAIL_PWD }}
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest
