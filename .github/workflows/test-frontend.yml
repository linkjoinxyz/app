name: Test Frontend

"on":
  pull_request:
    paths:
      - 'linkjoin-frontend/**'
      - 'linkjoin-extension/lib/scheduling.js'
  push:
    branches: [main, dev]
    paths:
      - 'linkjoin-frontend/**'
      - 'linkjoin-extension/lib/scheduling.js'
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkjoin-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # npm ci is stricter than we need here: the lockfile is dirtied by a known
        # npm bug where unused-platform esbuild optionalDependencies (pulled in by
        # vitest's own nested vite) get marked "extraneous" instead of properly
        # platform-scoped, even from a from-scratch npm install. npm install
        # tolerates this; npm ci's strict validation does not.
        run: npm install

      - name: Run tests
        run: npm test
