<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>LinkJoin</title>
    <script>
      // GitHub Pages SPA redirect: encode the path into the query string so
      // index.html can restore it before React Router boots.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) + (l.hash || '')
      );
    </script>
  </head>
  <body></body>
</html>
